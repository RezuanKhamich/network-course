<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет подключения к интернету — LazyLearn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4652c4">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<style>
:root{--bg:#f4f5f9;--panel:#fff;--ink:#1a1c26;--muted:#5e6274;--line:#dcdfe8;--accent:#4652c4}
@media (prefers-color-scheme:dark){:root{--bg:#10121a;--panel:#181b26;--ink:#e6e8f0;--muted:#9a9fb3;--line:#2a2e3d;--accent:#7b86f0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
.code{font:700 64px/1 ui-monospace,Consolas,monospace;color:var(--accent);margin-bottom:12px}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
a.btn{display:inline-block;background:#4652c4;color:#fff;text-decoration:none;font-weight:600;padding:10px 20px;border-radius:10px}
a.btn:hover{background:#3a45a8}
</style>
</head>
<body>
<main class="card">
 <div class="code">&gt;_</div>
 <h1>Нет подключения к интернету</h1>
 <p>Эта страница ещё не сохранена для работы без сети. Уроки, которые вы уже открывали, доступны офлайн.</p>
 <a class="btn" href="/">Попробовать снова</a>
</main>
</body>
</html>
