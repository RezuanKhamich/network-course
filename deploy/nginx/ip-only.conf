# Временный режим без домена: сайт по HTTP на IP-адресе сервера.
# Трафик не шифруется — только для просмотра и тестовых аккаунтов. С доменом provision.sh заменит этот конфиг.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    include snippets/devcourses-site.conf;
}
