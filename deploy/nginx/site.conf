# Общая часть сайта: статика и прокси к API. Подключается в server-блоки по домену и по IP.
root /srv/devcourses/web;
charset utf-8;

gzip on;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml;

location /api/ {
    include snippets/devcourses-headers.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # затираем то, что прислал клиент: API верит только этому значению
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
}

# файлы с хешем в имени не меняются никогда
location /assets/ {
    include snippets/devcourses-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# в mime.types дистрибутива может не быть webmanifest
location ~ \.webmanifest$ {
    include snippets/devcourses-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type application/manifest+json;
}

error_page 404 /404.html;

location / {
    include snippets/devcourses-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
